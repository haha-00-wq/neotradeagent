version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: quant_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
      image: redis:7-alpine
      container_name: quant_redis
      ports:
        - "6377:6379"
      restart: unless-stopped

  dashboard:
    build: .
    container_name: quant_dashboard
    ports:
      - "8501:8501"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  agent:
    build: .
    container_name: quant_agent
    command: python -m src.agent.trading_agent
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

volumes:
  postgres_data: